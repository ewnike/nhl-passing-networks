[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "possnet"
version = "0.1.0"
description = "Possession and passing network analysis: soccer (StatsBomb open data) first, hockey adapter later."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
app = ["streamlit>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
